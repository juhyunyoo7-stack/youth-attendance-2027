<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1020" media="(prefers-color-scheme: dark)">
<meta name="description" content="청소년부 2027년 주일 출석부 — 출석체크, 연간 출석부, 심방 관리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="출석부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<title>청소년부 출석부 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 앱 셸 — 고정 머리줄, 한 줄로 쌓이는 작업 패널, 휴대폰에서는 아래 탭바 */
:root{
  --paper:#f3f5f9; --surface:#ffffff; --surface-2:#eef1f7; --ink:#131a2c; --muted:#5b6479; --faint:#8a92a6;
  --line:#e0e4ed; --line-strong:#c8cedb;
  --accent:#2747d6; --accent-ink:#ffffff; --accent-soft:#e7ecfd; --accent-line:#b9c6f6;
  --p:#17834f; --p-bg:#e0f3e8; --l:#a35d00; --l-bg:#fcefd8; --e:#6547c2; --e-bg:#ede8fb; --a:#c0353b; --a-bg:#fbe3e3;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(19,26,44,.05),0 6px 20px rgba(19,26,44,.05);
  --scrim:rgba(13,17,32,.42); --on-status:#ffffff; --toast-act:#b9c6f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1020; --surface:#151a2c; --surface-2:#1c2237; --ink:#e7eaf3; --muted:#9aa2b9; --faint:#6f7891;
    --line:#272e48; --line-strong:#353e5e;
    --accent:#7d95ff; --accent-ink:#0b1030; --accent-soft:#1d264d; --accent-line:#34407a;
    --p:#5fd29a; --p-bg:#14342a; --l:#f1b45a; --l-bg:#3a2b12; --e:#ab97ff; --e-bg:#29214d; --a:#ff8a8f; --a-bg:#3f1c24;
    --shadow:none; --scrim:rgba(0,0,0,.6); --on-status:#0c1020; --toast-act:#2747d6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1020; --surface:#151a2c; --surface-2:#1c2237; --ink:#e7eaf3; --muted:#9aa2b9; --faint:#6f7891;
  --line:#272e48; --line-strong:#353e5e;
  --accent:#7d95ff; --accent-ink:#0b1030; --accent-soft:#1d264d; --accent-line:#34407a;
  --p:#5fd29a; --p-bg:#14342a; --l:#f1b45a; --l-bg:#3a2b12; --e:#ab97ff; --e-bg:#29214d; --a:#ff8a8f; --a-bg:#3f1c24;
  --shadow:none; --scrim:rgba(0,0,0,.6); --on-status:#0c1020; --toast-act:#2747d6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.shell{max-width:1120px;margin:0 auto;padding-inline:16px}

/* 머리줄 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--f-display);font-size:25px;font-weight:400;line-height:1;letter-spacing:.01em;color:var(--ink)}
.brand .mark em{font-style:normal;color:var(--accent)}
.brand .dept{font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.live .dot{background:var(--p)} .pill.busy .dot{background:var(--l)} .pill.err .dot{background:var(--a)}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:8px 12px;border-radius:9px;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs svg,.bnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--a);display:inline-block}
.bnav{display:none}

main{padding-block:20px 48px}
.view{display:grid;gap:16px}
.view[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2{font-size:16px;margin:0;text-wrap:balance}
.panel-h .hint{font-size:13px;color:var(--muted)}
h3{font-size:14px;margin:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}

/* 버튼·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--a);border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.icon{padding:0;width:38px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field.full{grid-column:1/-1}
input[type=text],input[type=search],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 11px;min-height:38px;font-weight:400;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.inline-sel{width:auto;min-width:0}

/* 주차 바 */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weekbar .wk-title{display:grid;flex:1;min-width:180px}
.wk-title .wk-date{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.wk-title .wk-sub{font-size:13px;color:var(--muted)}
.wk-label-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:3px}
.wk-select{width:auto;min-width:0;max-width:150px}

/* 요약 */
.tally{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.tally .t{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tally .t .k{font-size:12px;font-weight:600;color:var(--muted)}
.tally .t .v{font-size:22px;font-weight:600;line-height:1.3}
.tally .t.main{background:var(--accent-soft);border-color:var(--accent-line)}
.tally .t.main .v{color:var(--accent)}
.tally .t.main .v small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:var(--p)} .bar .l{background:var(--l)} .bar .e{background:var(--e)} .bar .a{background:var(--a)}
.t.p .v{color:var(--p)} .t.l .v{color:var(--l)} .t.e .v{color:var(--e)} .t.a .v{color:var(--a)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.chipbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding-bottom:2px}
.chipbar::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.search{max-width:220px}

/* 출석 명단 */
.group-h{display:flex;align-items:baseline;gap:8px;margin:20px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.group-h b{font-size:15px}
.group-h span{font-size:13px;color:var(--muted)}
.group-h .gstat{margin-left:auto;font-size:12.5px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.who{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;display:grid;gap:1px}
.who .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who:hover .nm{color:var(--accent)}
.flag{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;line-height:18px}
.flag.a{background:var(--a-bg);color:var(--a)} .flag.bd{background:var(--l-bg);color:var(--l)} .flag.new{background:var(--accent-soft);color:var(--accent)} .flag.off{background:var(--surface-2);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:11px;padding:3px;gap:3px;background:var(--surface-2);flex:none}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-size:14px;font-weight:600;color:var(--muted);min-width:50px;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink);background:var(--surface)}
.seg button.on.p{background:var(--p);color:var(--on-status)} .seg button.on.l{background:var(--l);color:var(--on-status)}
.seg button.on.e{background:var(--e);color:var(--on-status)} .seg button.on.a{background:var(--a);color:var(--on-status)}
.seg button.on{box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-strong)}
.lastby{font-size:12.5px;color:var(--muted);margin-top:8px}

/* 표 */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--surface-2)}
.ledger th,.ledger td{text-align:center;padding:0;min-width:30px;height:32px;border-left:1px solid var(--line)}
.ledger .stk{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px;min-width:104px;max-width:140px;overflow:hidden;text-overflow:ellipsis;border-left:0;box-shadow:1px 0 0 var(--line)}
.ledger thead .stk{z-index:3;background:var(--surface-2)}
.ledger thead tr.months th{font-size:11.5px;color:var(--ink);font-weight:700;height:26px;border-bottom:1px solid var(--line)}
.ledger thead tr.months th.stk{color:var(--muted)}
.ledger thead tr.weeks th{font-size:11px;font-weight:600;line-height:1.15;height:40px;vertical-align:middle}
.ledger thead tr.weeks th i{display:block;font-style:normal;font-size:9.5px;color:var(--accent);font-weight:700;max-width:34px;overflow:hidden;text-overflow:ellipsis;margin:1px auto 0}
.ledger td.c{cursor:pointer;font-weight:700;font-size:14px;user-select:none}
.ledger td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.ledger td.c.p{color:var(--p)} .ledger td.c.l{color:var(--l);background:var(--l-bg)}
.ledger td.c.e{color:var(--e);background:var(--e-bg)} .ledger td.c.a{color:var(--a);background:var(--a-bg)}
.ledger td.c.na{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--surface-2) 4px 6px);cursor:default}
.ledger td.c.na:hover{outline:0}
.ledger td.c.miss{color:var(--faint)}
.ledger td.sum{font-family:var(--f-num);font-size:12px;padding:0 8px;min-width:38px}
.ledger tr.grp td{background:var(--surface-2);font-weight:700;text-align:left;font-size:12.5px;height:28px}
.ledger tr.grp td.stk{background:var(--surface-2)}
.ledger tr.tot td{font-family:var(--f-num);font-size:12px;font-weight:600;background:var(--surface-2)}
.ledger tr.tot td.stk{background:var(--surface-2);font-family:var(--f-body)}
.ledger td.wkcur,.ledger th.wkcur{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tscroll.led{max-height:min(72vh,900px);overflow:auto;overscroll-behavior:contain}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend b{font-weight:700} .legend .p{color:var(--p)} .legend .l{color:var(--l)} .legend .e{color:var(--e)} .legend .a{color:var(--a)}

/* 통계 */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .k{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;line-height:1.25;margin-top:4px;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:2px}
.kpi .d{font-size:12px;color:var(--faint);margin-top:2px}
.kpi.warn .v{color:var(--a)}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:640px;width:100%;height:auto}
.chart-wrap text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.meter{display:inline-block;width:90px;height:6px;border-radius:9px;background:var(--surface-2);vertical-align:middle;margin-right:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.namechips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.nchip b{font-weight:700} .nchip span{color:var(--muted)}
button.nchip:hover{border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:22px 12px;font-size:14px}
.empty-hero{text-align:center;padding:36px 16px}
.empty-hero h2{font-size:19px;margin:0 0 6px}
.empty-hero p{color:var(--muted);margin:0 auto 16px;max-width:44ch}

/* 배너 */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--l) 40%,var(--line));background:var(--l-bg)}
.banner.err{border-color:color-mix(in srgb,var(--a) 40%,var(--line));background:var(--a-bg)}
.banner .btn{margin-left:auto}

/* 시트(모달) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.sheet-h h2{font-size:19px;margin:0;text-wrap:balance}
.sheet-h .x{margin-left:auto}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.strip i.p{background:var(--p)} .strip i.l{background:var(--l)} .strip i.e{background:var(--e)} .strip i.a{background:var(--a)} .strip i.miss{background:color-mix(in srgb,var(--a) 35%,var(--surface-2))}
.strip i.na{background:transparent;border:1px dashed var(--line-strong)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:0}
.facts div{min-width:0} .facts dt{font-size:12px;color:var(--muted);font-weight:600} .facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.visit{border-left:3px solid var(--accent-line);padding:4px 0 4px 12px;display:flex;gap:10px;align-items:flex-start}
.visit .vd{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.visit p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.callrow{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.callrow a{color:var(--accent);font-weight:600;text-decoration:none}
.btn.link{color:var(--accent);text-decoration:none}
.alist{display:grid;gap:0}
.arow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .who{flex:1 1 180px}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap}
.flag.ok{background:var(--p-bg);color:var(--p)}
.vlog{display:grid;gap:8px}
.vlog .visit .nm{font-weight:700;border:0;background:none;padding:0;color:var(--ink);white-space:nowrap}
.vlog .visit .nm:hover{color:var(--accent)}
.fchip.rest[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.report{font:13.5px/1.6 var(--f-body);min-height:260px}
.mini-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mini-stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.mini-stats .k{font-size:11.5px;color:var(--muted);font-weight:600}
.mini-stats .v{font-size:18px;font-weight:600}
details.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.box summary{cursor:pointer;font-weight:600}
details.box[open] summary{margin-bottom:12px}

<script>
(function(){
'use strict';
var MODE = 'local';           // 'local' = 이 기기 저장(설치형) · 'shared' = 교사 공유(claude.ai)

  '2027-05-02':'어린이주일', '2027-05-09':'어버이주일', '2027-05-16':'성령강림',
  '2027-07-04':'맥추감사', '2027-11-21':'추수감사', '2027-12-26':'성탄감사'
};

  ledger:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M3 14.8h18M9 4v16"/></svg>',
  students:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.8-3.3 3-5.2 5.5-5.2s4.7 1.9 5.5 5.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.3 14.4c2.2.1 3.7 1.6 4.3 4.1"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M5 20v-6M11 20V5M17 20v-9M3 20h18"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>'
};
var VIEWS = [
  {id:'check', t:'출석체크', i:'check'},
  {id:'ledger', t:'출석부', i:'ledger'},
  {id:'students', t:'학생', i:'students'},
  {id:'stats', t:'통계·심방', i:'stats'},
  {id:'settings', t:'설정', i:'settings'}
];

// ---------------- 날짜 ----------------
function pad(n){ return (n < 10 ? '0' : '') + n; }
function dkey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function md(k){ return (+k.slice(5,7)) + '/' + (+k.slice(8,10)); }
function mdK(k){ return (+k.slice(5,7)) + '월 ' + (+k.slice(8,10)) + '일'; }
var SUNDAYS = (function(){
  var out = [], d = new Date(YEAR, 0, 1);
  while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
  while (d.getFullYear() === YEAR){ out.push(dkey(d)); d.setDate(d.getDate() + 7); }
  return out;
})();
var TODAY = dkey(new Date());   // 앱을 며칠씩 열어 두어도 맞도록 화면에 돌아올 때 다시 잰다 (refreshToday)
function weekOfToday(){
  if (TODAY < SUNDAYS[0]) return -1;
  for (var i = SUNDAYS.length - 1; i >= 0; i--) if (SUNDAYS[i] <= TODAY) return i;
  return -1;
}

// ---------------- 상태 ----------------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function emptyState(){ return { meta:{ title:'청소년부', streak:3, steady:90, classes:[] }, students:{}, weeks:{}, sample:false }; }
var S = emptyState();
var ready = false, readOnly = false, canAdmin = MODE === 'local', fatal = '';
var meId = null, userNs = null, dlNs = null;
var loadWarn = '';

function str(v, max){ v = v == null ? '' : String(v); return max ? v.slice(0, max) : v; }
function cleanStudent(s){
  return {
    id:str(s.id) || uid(), name:str(s.name, 40).trim() || '이름 없음', grade:str(s.grade, 10), cls:str(s.cls, 40),
    gender:str(s.gender, 4), birth:/^\d{4}-\d{2}-\d{2}$/.test(s.birth || '') ? s.birth : '',
    school:str(s.school, 40), phone:str(s.phone, 30), parentPhone:str(s.parentPhone, 30), parentName:str(s.parentName, 30),
    joined:/^\d{4}-\d{2}-\d{2}$/.test(s.joined || '') ? s.joined : '',
    active:s.active !== false, note:str(s.note, 400),
    visits:Array.isArray(s.visits) ? s.visits.slice(0, 200).map(function(v){ return { id:str(v.id) || uid(), date:str(v.date, 10), note:str(v.note, 1000), by:str(v.by, 80) }; }) : []
  };
}
function cleanMeta(m){
  m = m || {};
  return {
    title:str(m.title, 30).trim() || '청소년부',
    streak:Math.min(20, Math.max(1, parseInt(m.streak, 10) || 3)),
    steady:Math.min(100, Math.max(50, parseInt(m.steady, 10) || 90)),
    classes:Array.isArray(m.classes) ? m.classes.map(function(c){ return { id:str(c.id) || uid(), name:str(c.name, 30) || '반', teacher:str(c.teacher, 40) }; }) : []
  };
}
function cleanWeek(w){
  var o = { marks:{} };
  if (w && w.marks) for (var k in w.marks){ var v = w.marks[k]; if (ST[v]) o.marks[k] = v; }
  if (w && typeof w.label === 'string') o.label = w.label.slice(0, 30);
  if (w && +w.guests > 0) o.guests = Math.min(999, parseInt(w.guests, 10));
  if (w && w.by) o.by = str(w.by, 80);
  if (w && w.at) o.at = str(w.at, 40);
  return o;
}
// 1.x(배열 형식)와 2.x 백업을 모두 받는다
function fromAny(d){
  var s = emptyState();
  if (!d || typeof d !== 'object') return s;
  if (Array.isArray(d.students)){
    s.meta = cleanMeta({ title:d.title, streak:d.streak, classes:d.classes });
    d.students.forEach(function(x){ var c = cleanStudent(x); s.students[c.id] = c; });
    var labels = d.labels || {}, att = d.att || {}, guests = d.guests || {};
    SUNDAYS.forEach(function(k){
      var w = { marks:att[k] || {} };
      if (k in labels) w.label = labels[k]; else if (DEFAULT_LABELS[k]) w.label = '';
      if (guests[k]) w.guests = guests[k];
      w = cleanWeek(w);
      if (Object.keys(w.marks).length || 'label' in w || w.guests) s.weeks[k] = w;
    });
    return s;
  }
  s.meta = cleanMeta(d.meta);
  var st = d.students || {};
  Object.keys(st).forEach(function(k){ var c = cleanStudent(st[k]); s.students[c.id] = c; });
  var wk = d.weeks || {};
  Object.keys(wk).forEach(function(k){ if (SUNDAYS.indexOf(k) >= 0) s.weeks[k] = cleanWeek(wk[k]); });
  s.sample = !!d.sample;
  return s;
}
function toBackup(){
  return { app:'youth-attendance', version:2, year:YEAR, exportedAt:new Date().toISOString(), sample:S.sample, meta:S.meta, students:S.students, weeks:S.weeks };
}

// ---------------- 조회 도우미 ----------------
function markOf(d, id){ var w = S.weeks[d]; return (w && w.marks && w.marks[id]) || ''; }
function labelOf(d){ var w = S.weeks[d]; if (w && typeof w.label === 'string') return w.label; return DEFAULT_LABELS[d] || ''; }
function isChecked(d){
  var w = S.weeks[d]; if (!w || !w.marks) return false;
  for (var k in w.marks) if (w.marks[k] && S.students[k]) return true;
  return false;
}
function checkedWeeks(){ return SUNDAYS.filter(isChecked); }
function allStudents(){ return Object.keys(S.students).map(function(k){ return S.students[k]; }); }
function activeStudents(){ return allStudents().filter(function(s){ return s.active; }); }
function clsById(id){ for (var i = 0; i < S.meta.classes.length; i++) if (S.meta.classes[i].id === id) return S.meta.classes[i]; return null; }
function clsName(id){ var c = clsById(id); return c ? c.name : '반 미배정'; }
function clsOrder(id){ for (var i = 0; i < S.meta.classes.length; i++) if (S.meta.classes[i].id === id) return i; return 999; }
function sortStudents(list){
  return list.slice().sort(function(a, b){
    return clsOrder(a.cls) - clsOrder(b.cls) || GRADES.indexOf(a.grade) - GRADES.indexOf(b.grade) || a.name.localeCompare(b.name, 'ko');
  });
}
function inCls(s, sel){ return !sel || (sel === "__none" ? !clsById(s.cls) : s.cls === sel); }
function belongs(s, d){ return !s.joined || d >= s.joined; }
function stuStats(s, weeks){
  var r = { P:0, L:0, E:0, A:0, n:0 };
  weeks.forEach(function(d){ if (!belongs(s, d)) return; r[markOf(d, s.id) || 'A']++; r.n++; });
  r.rate = r.n ? (r.P + r.L) / r.n : null;
  return r;
}
// 최근 체크 주일부터 거꾸로 센 연속 결석 (사유결석은 건너뜀)
function streakOf(s, weeks){
  var n = 0;
  for (var i = weeks.length - 1; i >= 0; i--){
    var d = weeks[i]; if (!belongs(s, d)) break;
    var v = markOf(d, s.id) || 'A';
    if (v === 'A') n++; else if (v === 'E') continue; else break;
  }
  return n;
}
// 지금 이어지는 연속 결석이 시작된 주일 (없으면 '')
function streakStartOf(s, weeks){
  var first = '';
  for (var i = weeks.length - 1; i >= 0; i--){
    var d = weeks[i]; if (!belongs(s, d)) break;
    var v = markOf(d, s.id) || 'A';
    if (v === 'A') first = d; else if (v === 'E') continue; else break;
  }
  return first;
}
function lastVisit(s){ return (s.visits || []).slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; })[0] || null; }
function digits(p){ return String(p || '').replace(/[^\d+]/g, ''); }
function callHtml(num){
  if (!num) return '';
  var n = digits(num); if (n.length < 3) return esc(num);
  return '<span class="callrow"><a href="tel:' + n + '">' + esc(num) + '</a><a class="btn sm" href="sms:' + n + '" aria-label="' + esc(num) + '로 문자">문자</a></span>';
}
function presentCount(d, list){
  var n = 0; (list || activeStudents()).forEach(function(s){ var v = markOf(d, s.id); if (v === 'P' || v === 'L') n++; }); return n;
}
function enrolledAt(d){ return activeStudents().filter(function(s){ return belongs(s, d); }).length; }
function pct(x){ return x == null ? '–' : Math.round(x * 100) + '%'; }
function bdayMD(s){
  var b = s.birth.slice(5);
  return b === '02-29' && new Date(YEAR, 1, 29).getMonth() !== 1 ? '02-28' : b;   // 평년에는 2월 28일에 축하
}
function isBirthdayWeek(s, d){
  if (!s.birth) return false;
  var sun = new Date(d + 'T00:00:00'), bd = bdayMD(s);
  for (var i = 0; i < 7; i++){
    var x = new Date(sun); x.setDate(sun.getDate() + i);
    if (pad(x.getMonth()+1) + '-' + pad(x.getDate()) === bd) return true;
  }
  return false;
}

// ---------------- 유틸 ----------------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function pref(k, v){
  try {
    if (arguments.length === 1) return localStorage.getItem(KEY + ':pref:' + k);
    localStorage.setItem(KEY + ':pref:' + k, v);
  } catch(e){ return null; }
}
var toastTimer;
function toast(msg, action){
  $('toastMsg').textContent = msg;
  var b = $('toastAct');
  if (action){ b.hidden = false; b.textContent = action.label; b.onclick = function(){ hideToast(); action.fn(); }; }
  else { b.hidden = true; b.onclick = null; }

  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, action ? 8000 : 2400);
}
function hideToast(){ $('toast').classList.remove('show'); }
function safeName(t){ return String(t).replace(/[\\/:*?"<>|\s]+/g, '_'); }
// 백업 불러오기·초기화 직전 자료를 이 브라우저에 한 벌 보관해 두었다가 되돌릴 수 있게 한다
function hasData(){ return Object.keys(S.students).length > 0 || Object.keys(S.weeks).length > 0; }
function snapshot(reason){
  if (!hasData() || S.sample) return false;
  try { localStorage.setItem(KEY + ':prev', JSON.stringify({ at:Date.now(), reason:reason, data:toBackup() })); return true; } catch(e){ return false; }
}
function prevSnap(){ try { var r = localStorage.getItem(KEY + ':prev'); var o = r && JSON.parse(r); return o && o.data ? o : null; } catch(e){ return null; } }
function restorePrev(){
  var p = prevSnap(); if (!p) return;
  var cur = hasData() && !S.sample ? toBackup() : null;
  toast('되돌리는 중…');
  store.replaceAll(fromAny(p.data)).then(function(){
    try {
      if (cur) localStorage.setItem(KEY + ':prev', JSON.stringify({ at:Date.now(), reason:'되돌리기', data:cur }));
      else localStorage.removeItem(KEY + ':prev');
    } catch(e){}
    wk = defaultWeek(); toast('직전 자료로 되돌렸습니다'); render();
  }, function(){ toast('일부를 되돌리지 못했습니다. 다시 시도해 주세요.'); });
}

// ---------------- 시트(모달) ----------------
var sheetClose = null, sheetOpener = null;
function openSheet(html, onMount, onClose){
  if ($('scrim').hidden){ sheetOpener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null; }
  $('sheet').innerHTML = html;
  $('scrim').hidden = false;
  document.body.style.overflow = 'hidden';
  var h2 = $('sheet').querySelector('h2');
  if (h2){ h2.id = 'sheetTitle'; $('sheet').setAttribute('aria-labelledby', 'sheetTitle'); } else $('sheet').removeAttribute('aria-labelledby');
  sheetClose = onClose || null;
  if (onMount) onMount($('sheet'));
  var f = $('sheet').querySelector('[autofocus]');
  setTimeout(function(){ if (f) f.focus(); else if (!$('sheet').contains(document.activeElement)){ var x = $('sheet').querySelector('button,[href],input,select,textarea'); if (x) x.focus({ preventScroll:true }); } }, 30);
}
function closeSheet(){
  $('scrim').hidden = true; $('sheet').innerHTML = ''; document.body.style.overflow = '';
  var c = sheetClose; sheetClose = null; if (c) c();
  var o = sheetOpener; sheetOpener = null;
  if (o && document.contains(o) && $('scrim').hidden) try { o.focus({ preventScroll:true }); } catch(e){}
}
$('scrim').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !$('scrim').hidden){ closeSheet(); return; }
  // 출석체크 화면: ← → 로 주일 이동 (입력 중이 아닐 때)
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && view === 'check' && ready && $('scrim').hidden && !e.altKey && !e.ctrlKey && !e.metaKey){
    var tg = e.target.tagName; if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
    var nw = wk + (e.key === 'ArrowLeft' ? -1 : 1);
    if (nw >= 0 && nw < SUNDAYS.length){ wk = nw; e.preventDefault(); render(); }
  }
});
// 브라우저 확인창 대신 쓰는 화면 안 확인 단계
function ask(o){
  return new Promise(function(resolve){
    var done = false;
    openSheet(
      '<div class="sheet-h"><h2>' + esc(o.title) + '</h2></div>' +

var store = MODE === 'shared' ? sharedStore() : localStore();

function localStore(){
  var lastErr = 0;
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(toBackup())); }
    catch(e){ if (Date.now() - lastErr > 8000){ lastErr = Date.now(); toast('기기 저장 공간에 쓰지 못했습니다. 설정에서 백업 파일을 받아 두세요.'); } }
    if (!persistAsked && navigator.storage && navigator.storage.persist && location.protocol === 'https:'){ persistAsked = true; navigator.storage.persist().catch(function(){}); }
  }
  var persistAsked = false;
  function week(d){ return S.weeks[d] || (S.weeks[d] = { marks:{} }); }
  function tidy(d){ var w = S.weeks[d]; if (w && !Object.keys(w.marks).length && !('label' in w) && !w.guests) delete S.weeks[d]; }
  return {
    kind:'local',
    init:function(){
      var raw = null;
      try { raw = localStorage.getItem(KEY); } catch(e){ loadWarn = 'blocked'; }
      if (raw){
        try { S = fromAny(JSON.parse(raw)); }
        catch(e){
          // 읽지 못한 원본을 덮어쓰지 않도록 따로 옮겨 둔다
          loadWarn = 'corrupt';
          try { localStorage.setItem(KEY + ':unreadable:' + Date.now(), raw); } catch(e2){}
        }
      }
      // 같은 기기에서 창을 두 개 열었을 때 서로 덮어쓰지 않도록 맞춘다
      window.addEventListener('storage', function(e){
        if (e.key !== KEY || !e.newValue) return;
        try { S = fromAny(JSON.parse(e.newValue)); render(); } catch(err){}
      });
      ready = true; setSync('local'); render();
    },
    setMarks:function(d, obj){
      var w = week(d);
      for (var id in obj){ if (obj[id]) w.marks[id] = obj[id]; else delete w.marks[id]; }
      w.at = new Date().toISOString();
      tidy(d); persist(); render();
    },
    setWeek:function(d, f){ var w = week(d); for (var k in f){ if (f[k] === null) delete w[k]; else w[k] = f[k]; } tidy(d); persist(); render(); },
    putStudent:function(s){ S.students[s.id] = s; persist(); render(); },
    removeStudent:function(id){
      delete S.students[id];
      Object.keys(S.weeks).forEach(function(d){ delete S.weeks[d].marks[id]; tidy(d); });
      persist(); render();
    },
    putMeta:function(m){ S.meta = m; persist(); render(); },
    replaceAll:function(ns){ S = ns; persist(); render(); return Promise.resolve(); }
  };
}

function sharedStore(){
  var db = null, queues = {}, pending = 0, loaded = { meta:false, students:false, weeks:false };
  function track(p){
    pending++; setSync('busy');
    return p.then(function(){ pending--; if (!pending) setSync('live'); }, function(e){ pending--; setSync(pending ? 'busy' : 'live'); throw e; });
  }
  function queue(path, fn){
    var prev = queues[path] || Promise.resolve();
    var next = prev.catch(function(){}).then(fn);
    queues[path] = next.catch(function(){});
    return track(next);
  }
  function fail(e){
    var code = e && e.code;
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked'){
      if (!readOnly){ readOnly = true; render(); }
      toast('이 출석부를 고칠 권한이 없습니다. 보기 전용으로 전환했습니다.');
    } else if (code === 'quota_exceeded'){
      toast('공유 출석부 저장 용량이 가득 찼습니다. 오래된 기록을 정리해 주세요.');
    } else if (code === 'resource_exhausted'){
      toast('요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.');
    } else {
      toast('저장하지 못했습니다. 연결을 확인한 뒤 다시 눌러 주세요.');
    }
    throw e;
  }
  function retryOnce(fn){
    return fn().catch(function(e){
      if (e && e.code === 'unavailable') return new Promise(function(r){ setTimeout(r, 400 + Math.random() * 600); }).then(fn);
      throw e;
    });
  }
  function upsert(path, partial){
    return queue(path, function(){
      var ref = db.doc(path);
      return retryOnce(function(){ return ref.update(partial); }).catch(function(e){
        if (e && e.code === 'invalid_argument') return ref.set(partial); // 아직 없는 문서
        throw e;
      }).catch(fail);
    });
  }
  function put(path, body){ return queue(path, function(){ return retryOnce(function(){ return db.doc(path).set(body); }).catch(fail); }); }
  function del(path){ return queue(path, function(){ return retryOnce(function(){ return db.doc(path).delete(); }).catch(fail); }); }
  function stamp(){ var o = { at:new Date().toISOString() }; if (meId) o.by = meId; return o; }
  function maybeReady(){
    if (!ready && loaded.meta && loaded.students && loaded.weeks){ ready = true; setSync('live'); }
    render();
  }
  function lost(e){
    setSync('err');
    if (e && (e.code === 'revoked' || e.code === 'not_granted')){ readOnly = true; }
    render();
  }
  function waitClaude(n){
    return new Promise(function(resolve){
      (function poll(i){
        if (window.claude && typeof window.claude.use === 'function') return resolve(window.claude);
        if (i <= 0) return resolve(null);
        setTimeout(function(){ poll(i - 1); }, 250);
      })(n);
    });
  }
  return {
    kind:'shared',
    init:function(){
      setSync('busy'); render();
      waitClaude(40).then(function(c){
        if (!c){ fatal = 'claude.ai 안에서 열어야 공유 출석부를 쓸 수 있습니다.'; setSync('err'); render(); return; }
        return Promise.all([c.use('db'), c.use('user'), c.use('downloads')]).then(function(r){
          db = r[0]; userNs = r[1]; dlNs = r[2];
          if (!db){ fatal = '공유 출석부를 열 수 없습니다. claude.ai에 로그인한 상태로, 초대받은 계정으로 열어 주세요.'; setSync('err'); render(); return; }
          var p = userNs ? Promise.all([userNs.id(), userNs.can('data.write'), userNs.canEdit()]) : Promise.resolve([null, null, false]);
          return p.then(function(u){
            meId = u[0]; if (u[1] === false) readOnly = true; canAdmin = !!u[2];
            db.doc('config/main').onSnapshot(function(s){ if (s.exists) S.meta = cleanMeta(s.data()); loaded.meta = true; maybeReady(); }, lost);
            db.collection('students').onSnapshot(function(qs){
              var o = {}; qs.docs.forEach(function(d){ var x = cleanStudent(Object.assign({}, d.data(), { id:d.id })); o[d.id] = x; });
              S.students = o; loaded.students = true; maybeReady();
            }, lost);
            db.collection('weeks').onSnapshot(function(qs){
              var o = {}; qs.docs.forEach(function(d){ o[d.id] = cleanWeek(d.data()); });
              S.weeks = o; loaded.weeks = true; maybeReady();
            }, lost);
          });
        });
      }).catch(function(){ fatal = '공유 출석부에 연결하지 못했습니다. 페이지를 새로 고쳐 주세요.'; setSync('err'); render(); });
    },
    setMarks:function(d, obj){
      var w = S.weeks[d] || (S.weeks[d] = { marks:{} });
      var marks = {};
      for (var id in obj){ marks[id] = obj[id] || null; if (obj[id]) w.marks[id] = obj[id]; else delete w.marks[id]; }
      var st = stamp(); w.at = st.at; if (st.by) w.by = st.by;
      render();
      return upsert('weeks/' + d, Object.assign({ marks:marks }, st)).catch(function(){});
    },
    setWeek:function(d, f){
      var w = S.weeks[d] || (S.weeks[d] = { marks:{} });
      for (var k in f){ if (f[k] === null) delete w[k]; else w[k] = f[k]; }
      render();
      var body = {}; for (var k2 in f) body[k2] = f[k2];
      return upsert('weeks/' + d, body).catch(function(){});
    },
    putStudent:function(s){ S.students[s.id] = s; render(); return put('students/' + s.id, s).catch(function(){}); },
    removeStudent:function(id){ delete S.students[id]; render(); return del('students/' + id).catch(function(){}); },
    putMeta:function(m){ S.meta = m; render(); return put('config/main', m).catch(function(){}); },
    replaceAll:function(ns, progress){
      var ops = [];
      ops.push(function(){ return put('config/main', ns.meta); });
      Object.keys(S.students).forEach(function(id){ if (!ns.students[id]) ops.push(function(){ return del('students/' + id); }); });
      Object.keys(ns.students).forEach(function(id){ ops.push(function(){ return put('students/' + id, ns.students[id]); }); });
      Object.keys(S.weeks).forEach(function(d){ if (!ns.weeks[d]) ops.push(function(){ return del('weeks/' + d); }); });
      Object.keys(ns.weeks).forEach(function(d){ ops.push(function(){ return put('weeks/' + d, ns.weeks[d]); }); });
      var i = 0, total = ops.length, failed = 0;
      function worker(){
        if (i >= total) return Promise.resolve();
        var op = ops[i++];
        return op().catch(function(){ failed++; }).then(function(){ if (progress) progress(i, total); return worker(); });
      }
      return Promise.all([worker(), worker(), worker()]).then(function(){ if (failed) throw new Error(failed + '건 실패'); });
    }
  };
}

function chartSvg(){
  var Wd = 860, H = 230, L = 34, R = 8, T = 14, B = 26;
  var data = SUNDAYS.map(function(d){ return isChecked(d) ? { p:presentCount(d), e:enrolledAt(d) } : null; });
  var maxV = 5; data.forEach(function(x){ if (x) maxV = Math.max(maxV, x.e, x.p); });
  var step = maxV <= 10 ? 2 : maxV <= 25 ? 5 : maxV <= 60 ? 10 : maxV <= 150 ? 25 : 50;
  var top = Math.ceil(maxV / step) * step;
  var bw = (Wd - L - R) / SUNDAYS.length;
  function y(v){ return T + (H - T - B) * (1 - v / top); }
  var s = '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="주일별 출석 인원">';
  for (var g = 0; g <= top; g += step) s += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(g) + 3.5) + '" text-anchor="end">' + g + '</text>';
  var cur = SUNDAYS[wk];
  data.forEach(function(x, i){
    var d = SUNDAYS[i], cx = L + i * bw;
    if (x){
      s += '<rect x="' + (cx + bw * .14) + '" y="' + y(x.e) + '" width="' + (bw * .72) + '" height="' + (y(0) - y(x.e)) + '" rx="2" fill="var(--accent-soft)"/>';
      s += '<rect x="' + (cx + bw * .14) + '" y="' + y(x.p) + '" width="' + (bw * .72) + '" height="' + Math.max(0, y(0) - y(x.p)) + '" rx="2" fill="var(--accent)"><title>' + md(d) + (labelOf(d) ? ' ' + esc(labelOf(d)) : '') + ' — 출석 ' + x.p + '명 / 재적 ' + x.e + '명</title></rect>';
    } else {
      s += '<rect x="' + (cx + bw * .38) + '" y="' + (y(0) - 2) + '" width="' + (bw * .24) + '" height="2" fill="var(--line-strong)"/>';
    }
    if (+d.slice(8) <= 7) s += '<text x="' + (cx + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + (+d.slice(5, 7)) + '월</text>';
    if (d === cur) s += '<rect x="' + cx + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '" fill="none" stroke="var(--accent)" stroke-dasharray="3 3" stroke-width="1"/>';
  });
  s += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line-strong)"/>';
  return s + '</svg>';
}

    var id = uid() + i, mo = 1 + Math.floor(rnd() * 12), da = 1 + Math.floor(rnd() * 28);
    s.students[id] = cleanStudent({ id:id, name:n[0], grade:n[1], cls:s.meta.classes[ci[n[1]]].id, gender:i % 2 ? '여' : '남',
      birth:(n[1][0] === '중' ? 2013 : 2010) + '-' + pad(mo) + '-' + pad(da), school:(n[1][0] === '중' ? '한빛중' : '새솔고'), phone:'010-0000-' + pad(10 + i) + '00',
      joined:i === 17 ? '2027-03-07' : '', active:true, note:i === 4 ? '기말고사 기도 부탁' : '' });
  });
  var ids = Object.keys(s.students), tend = ids.map(function(_, i){ return i === 7 || i === 13 ? .35 : .78 + rnd() * .2; });
  SUNDAYS.slice(0, 14).forEach(function(d, wi){
    var w = { marks:{} };
    ids.forEach(function(id, i){
      if (!belongs(s.students[id], d)) return;
      var r = rnd(), t = (i === 7 && wi > 9) ? 0 : tend[i];
      w.marks[id] = r < t ? (rnd() < .1 ? 'L' : 'P') : (rnd() < .3 ? 'E' : 'A');
    });
    if (wi === 9) w.guests = 3;
    s.weeks[d] = w;
  });
  s.students[ids[7]].visits = [{ id:uid(), date:'2027-03-30', note:'어머니와 통화 — 학원 일정으로 주일 오전이 어렵다고 함', by:'' }];
  return s;
}

// =====================================================================
// 이벤트
// =====================================================================
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.dataset.act;
  if (t.tagName === 'A') e.preventDefault();
  switch (a){
    case 'nav': view = t.dataset.v; pref('view', view); window.scrollTo(0, 0); render(); break;
    case 'close': closeSheet(); break;
    case 'wk-prev': if (wk > 0){ wk--; render(); } break;
    case 'wk-next': if (wk < SUNDAYS.length - 1){ wk++; render(); } break;
    case 'wk-today': wk = weekOfToday(); render(); break;
    case 'chk-cls': chkCls = t.dataset.v; pref('chkCls', chkCls); render(); break;
    case 'chk-rest': chkRest = !chkRest; render(); break;
    case 'report': reportSheet(); break;
    case 'warn-ok': loadWarn = ''; render(); break;
    case 'prev-restore':
      ask({ title:'직전 자료로 되돌릴까요?', body:'지금 출석부는 보관해 둔 직전 자료로 바뀝니다. 지금 자료도 한 벌 보관하므로 다시 되돌릴 수 있습니다.', ok:'되돌리기' }).then(function(y){ if (y) restorePrev(); });
      break;
    case 'mark':
      if (readOnly) return;
      var d = SUNDAYS[wk], id = t.dataset.id, v = t.dataset.v, o = {};
      o[id] = markOf(d, id) === v ? '' : v; store.setMarks(d, o); break;
    case 'fill': if (!readOnly) fillRest(t.dataset.v); break;
    case 'week-edit': if (!readOnly) weekEditSheet(); break;
    case 'cell':
      if (readOnly) return;
      var cd = t.dataset.d, cid = t.dataset.id, cur = markOf(cd, cid), oo = {};
      oo[cid] = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length]; store.setMarks(cd, oo); break;
    case 'csv-ledger': saveFile(safeName(S.meta.title) + '_출석부_' + YEAR + '_' + RANGES[ledRange][2] + '.csv', ledgerCsv(ledgerStudents(), rangeWeeks()), 'text/csv;charset=utf-8'); break;
    case 'csv-all': saveFile(safeName(S.meta.title) + '_전체출석부_' + YEAR + '.csv', ledgerCsv(sortStudents(allStudents()), SUNDAYS), 'text/csv;charset=utf-8'); break;
    case 'csv-roster': saveFile(safeName(S.meta.title) + '_학생명단_' + YEAR + '.csv', rosterCsv(), 'text/csv;charset=utf-8'); break;
    case 'print':
      var v1 = $('v-ledger'); v1.classList.add('printing'); window.print(); setTimeout(function(){ v1.classList.remove('printing'); }, 600); break;
    case 'stu-new': if (!readOnly) studentForm(null); break;
    case 'stu-open': studentDetail(t.dataset.id); break;
    case 'stu-edit': if (!readOnly) studentForm(S.students[t.dataset.id]); break;
    case 'stu-del':
      var victim = S.students[t.dataset.id]; if (!victim) return;
      ask({ title:victim.name + ' 학생을 삭제할까요?', body:'출석·심방 기록도 함께 사라집니다.\n졸업이나 전출이라면 삭제 대신 상태를 ‘휴적·졸업·전출’로 바꾸세요. 기록이 남습니다.', ok:'삭제', danger:true })
        .then(function(y){
          if (!y) return;
          var keepMarks = {};
          Object.keys(S.weeks).forEach(function(d){ var mv = S.weeks[d].marks && S.weeks[d].marks[victim.id]; if (mv) keepMarks[d] = mv; });
          store.removeStudent(victim.id);
          toast(victim.name + ' 학생을 삭제했습니다', { label:'되돌리기', fn:function(){
            store.putStudent(victim);
            if (store.kind === 'local') Object.keys(keepMarks).forEach(function(d){ var o = {}; o[victim.id] = keepMarks[d]; store.setMarks(d, o); });
            toast('되돌렸습니다');
          } });
        });
      break;
    case 'visit-del':
      var vs = S.students[t.dataset.sid]; if (!vs) return;
      var gone = vs.visits.filter(function(x){ return x.id === t.dataset.vid; })[0]; if (!gone) return;
      var nx = cleanStudent(Object.assign({}, vs, { visits:vs.visits.filter(function(x){ return x.id !== gone.id; }) }));
      store.putStudent(nx); studentDetail(vs.id);
      toast('심방 기록을 지웠습니다', { label:'되돌리기', fn:function(){
        var cur = S.students[vs.id]; if (!cur) return;
        store.putStudent(cleanStudent(Object.assign({}, cur, { visits:cur.visits.concat([gone]) })));
        if (!$('scrim').hidden && $('sheet').querySelector('[data-act=stu-edit][data-id="' + vs.id + '"]')) studentDetail(vs.id);
        toast('되돌렸습니다');
      } });
      break;
    case 'bulk-open': if (!readOnly) bulkSheet(); break;
    case 'cls-up':
      var i = +t.dataset.i, m = cleanMeta(S.meta), tmp = m.classes[i - 1]; m.classes[i - 1] = m.classes[i]; m.classes[i] = tmp; store.putMeta(m); break;
    case 'cls-del':
      var c = clsById(t.dataset.id); if (!c) return;
      var mem = allStudents().filter(function(s){ return s.cls === c.id; });
      ask({ title:c.name + '을(를) 삭제할까요?', body:mem.length ? '소속 학생 ' + mem.length + '명은 ‘반 미배정’으로 옮겨집니다. 출석 기록은 그대로 남습니다.' : '소속 학생이 없습니다.', ok:'삭제', danger:true }).then(function(y){
        if (!y) return;
        var mm = cleanMeta(S.meta); mm.classes = mm.classes.filter(function(x){ return x.id !== c.id; }); store.putMeta(mm);
        mem.forEach(function(s){ store.putStudent(cleanStudent(Object.assign({}, s, { cls:'' }))); });
      });
      break;
    case 'backup': doBackup(); break;
    case 'restore': $('fileIn').value = ''; $('fileIn').click(); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt = null; render(); }); } break;
    case 'reset':
      ask({ title:'전체 초기화', body:'모든 학생, 반, 출석·심방 기록이 지워집니다. 되돌릴 수 없습니다.', ok:'모두 지우기', danger:true, type:'초기화' }).then(function(y){
        if (!y) return;
        var saved = snapshot('전체 초기화');
        store.replaceAll(emptyState()).then(function(){ wk = defaultWeek(); toast('초기화했습니다', saved ? { label:'되돌리기', fn:restorePrev } : null); }, function(){ toast('일부를 지우지 못했습니다. 다시 시도해 주세요.'); });
      });
      break;
    case 'sample-load':
      if (MODE !== 'local') return;
      store.replaceAll(sampleState()); wk = 13; toast('예시 데이터를 불러왔습니다'); break;
    case 'sample-clear':
      ask({ title:'예시 데이터를 지울까요?', body:'예시 학생과 출석 기록이 모두 지워지고 빈 출석부로 시작합니다.', ok:'지우고 시작', danger:true }).then(function(y){ if (y){ store.replaceAll(emptyState()); wk = defaultWeek(); view = 'students'; pref('view', view); } });
      break;
  }
});
document.addEventListener('change', function(e){
  var t = e.target, id = t.id;
  if (id === 'wkSel'){ wk = +t.value; render(); }
  else if (id === 'ledCls'){ ledCls = t.value; render(); }
  else if (id === 'ledRange'){ ledRange = t.value; render(); }
  else if (id === 'stuCls'){ stuCls = t.value; render(); }
  else if (id === 'stuShow'){ stuShow = t.value; render(); }
  else if (id === 'bdMonth'){ bdMonth = +t.value; render(); }
  else if (id === 'setTitle' || id === 'setStreak' || id === 'setSteady'){
    var m = cleanMeta(S.meta);
    if (id === 'setTitle') m.title = t.value; else if (id === 'setStreak') m.streak = t.value; else m.steady = t.value;
    store.putMeta(cleanMeta(m)); toast('설정을 저장했습니다');
  }
  else if (id === 'setTheme'){ pref('theme', t.value); applyTheme(); }
  else if (id === 'fileIn'){ if (t.files[0]) doRestore(t.files[0]); }
  else if (t.dataset.cname || t.dataset.cteach){
    var mm = cleanMeta(S.meta), cid = t.dataset.cname || t.dataset.cteach;
    mm.classes.forEach(function(c){ if (c.id === cid){ if (t.dataset.cname) c.name = t.value.trim() || c.name; else c.teacher = t.value.trim(); } });
    store.putMeta(mm);
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.id === 'chkQ'){ chkQ = t.value; var d = SUNDAYS[wk]; $('chkList').innerHTML = checkListHtml(chkTargets(), d, checkedWeeks(), S.meta.streak); }
  else if (t.id === 'stuQ'){ stuQ = t.value; clearTimeout(t._tm); t._tm = setTimeout(function(){ render(); setTimeout(function(){ var q = $('stuQ'); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 20); }, 250); }
});
document.addEventListener('submit', function(e){
  if (e.target.id === 'clsAdd'){
    e.preventDefault();
    var n = $('newClsName').value.trim(); if (!n) return;
    var m = cleanMeta(S.meta); m.classes.push({ id:uid(), name:n.slice(0, 30), teacher:$('newClsTeacher').value.trim().slice(0, 40) });
    store.putMeta(m); toast(n + ' 반을 추가했습니다');
  }
});
function applyTheme(){
  if (MODE !== 'local') return;
  var th = pref('theme');
  if (th) document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
}
applyTheme();

// 앱을 열어 둔 채 다음 주일이 되어도 오늘 날짜·이번 주를 다시 맞춘다
function refreshToday(){
  var t = dkey(new Date()); if (t === TODAY) return;
  var auto = wk === null || wk === defaultWeek();
  TODAY = t;
  if (auto && ready) wk = defaultWeek();
  render();
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) refreshToday(); });
window.addEventListener('focus', refreshToday);
setInterval(refreshToday, 60000);

// 설치형: 오프라인 캐시
if (MODE === 'local' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('새 버전이 준비됐습니다', { label:'새로 고침', fn:function(){ location.reload(); } });
        });
      });
    }).catch(function(){});
  });
}

store.init();
render();
})();
</script>
